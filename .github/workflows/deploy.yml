# Rebuilds the site with a fresh calendar snapshot and event stats, and publishes it to GitHub Pages.
# Runs on every push to main, every Monday at 06:00 UTC (08:00 Amsterdam), and whenever triggered manually
# from the Actions tab. Manual `npm run deploy` from a laptop keeps working too (its predeploy refreshes both).
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh calendar snapshot
        run: npm run calendar

      - name: Refresh event stats
        run: npm run stats

      - name: Build
        run: npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Scheduled deploy (fresh calendar + stats) from ${{ github.sha }}"
